<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Менеджер задач</title>
  <meta name="description" content="Простой менеджер задач с офлайн-режимом">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icons/ico_192.png">
  <link rel="apple-touch-icon" href="/icons/ico_192.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a class="brand" href="/">
        <img src="/icons/ico_192.png" alt="" width="32" height="32">
        <span>Менеджер задач</span>
      </a>
      <nav class="nav">
        <a href="/" class="nav__link nav__link--active" aria-current="page">Задачи</a>
        <a href="/about" class="nav__link">О приложении</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div id="offline-banner" class="banner" hidden>
      Нет соединения. Показаны сохранённые данные, добавление задач недоступно.
    </div>

    <section class="card">
      <h1 class="card__title">Новая задача</h1>
      <form id="task-form" class="form" novalidate>
        <label class="visually-hidden" for="task-title">Название задачи</label>
        <input id="task-title" class="input" type="text" name="title"
               placeholder="Что нужно сделать?" maxlength="200" autocomplete="off" required>
        <button class="btn" type="submit">Добавить</button>
      </form>
      <p id="form-error" class="error" role="alert" hidden></p>
    </section>

    <section class="card">
      <div class="card__head">
        <h2 class="card__title">Список задач</h2>
        <span id="counter" class="counter" aria-live="polite"></span>
      </div>

      <div class="filters" role="group" aria-label="Фильтр задач">
        <button class="chip chip--active" type="button" data-filter="all">Все</button>
        <button class="chip" type="button" data-filter="true">Выполненные</button>
        <button class="chip" type="button" data-filter="false">Невыполненные</button>
      </div>

      <ul id="task-list" class="tasks" aria-live="polite"></ul>
      <p id="empty" class="empty" hidden>Задач нет.</p>
      <p id="load-error" class="error" role="alert" hidden></p>
    </section>
  </main>

  <script src="/js/script.js"></script>
</body>
</html>
